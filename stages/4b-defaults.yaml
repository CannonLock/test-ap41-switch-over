# Stage 4, relying on defaults: remove Server.IssuerUrl and the export's IssuerUrls, so Pelican picks
# the embedded issuer itself.
Logging:
  Origin:
    Scitokens: trace
Server:
  Hostname: ap41.uw.osg-htc.org
  ExternalWebUrl: https://ap41.uw.osg-htc.org:8444
  WebPort: 8444
Federation:
  DiscoveryUrl: https://osg-htc.org
Origin:
  StorageType: posix
  EnableIssuer: true
  IssuerMode: embedded
  Exports:
    - FederationPrefix: /ospool/ap41/
      StoragePrefix: /storage/ap41/
      Capabilities: ["DirectReads", "Writes", "Reads", "Listings"]
