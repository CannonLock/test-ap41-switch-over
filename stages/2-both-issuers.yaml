# Stage 2: trust the /ospool/ap41 embedded issuer (first) and the current issuer. The AP's key is one
# of the Origin's own signing keys, which the embedded issuer always publishes. Step 3 (the AP switches
# its iss) needs no Origin change.
Logging:
  Origin:
    Scitokens: trace
Server:
  Hostname: ap41.uw.osg-htc.org
  ExternalWebUrl: https://ap41.uw.osg-htc.org:8444
  WebPort: 8444
  IssuerUrl: https://ap41.uw.osg-htc.org:8444
Federation:
  DiscoveryUrl: https://osg-htc.org
Origin:
  StorageType: posix
  EnableIssuer: true
  IssuerMode: embedded
  Exports:
    - FederationPrefix: /ospool/ap41/
      StoragePrefix: /storage/ap41/
      Capabilities: ["DirectReads", "Writes", "Reads", "Listings"]
      IssuerUrls:
        - https://ap41.uw.osg-htc.org:8444/api/v1.0/issuer/ns/ospool/ap41     # added, first
        - https://ap41.uw.osg-htc.org:8444
